[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-mcp-opportunity-scanner"
version = "0.1.0"
description = "Find candidate MCP tools for local projects without uploading project data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raintree Technology" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
ate-scan = "ate_opportunity_scanner:main"

[project.urls]
Homepage = "https://github.com/admin-raintree/ate-mcp-opportunity-scanner"
Issues = "https://github.com/admin-raintree/ate-mcp-opportunity-scanner/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
